# ============================================================
# TZJ Redis Configuration (Development)
# ============================================================

# Bind to all interfaces (container networking)
bind 0.0.0.0

# Authentication
requirepass tzj_redis_dev

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Slow log (queries > 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security: disable dangerous commands in dev
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
