# ============================================================
# TZJ Monorepo — Development Infrastructure (Docker Compose)
# ============================================================
# 原则: 应用跑在宿主机 (Native Node), 依赖跑在容器
# 启动: pnpm db:up   或  docker compose -f infra/docker/docker-compose.dev.yml up -d
# 停止: pnpm db:down 或  docker compose -f infra/docker/docker-compose.dev.yml down
# 日志: pnpm db:logs 或  docker compose -f infra/docker/docker-compose.dev.yml logs -f
# 清理: docker compose -f infra/docker/docker-compose.dev.yml down -v
# ============================================================

services:
  # ── PostgreSQL 15 ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tzj-postgres-dev
    restart: unless-stopped
    ports:
      - "3232:5432"
    environment:
      POSTGRES_USER: tzj_admin
      POSTGRES_PASSWORD: tzj_secret_dev
      POSTGRES_DB: tzj_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzj_admin -d tzj_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tzj-dev

  # ── MinIO (S3-compatible Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: tzj-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "3290:9000"   # S3 API（宿主机 3290 → 容器内 9000）
      - "3291:9001"   # Web Console（宿主机 3291 → 容器内 9001）
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # ── 开发环境 CORS（MinIO 原生全局配置，启动即生效，无需额外初始化容器）──
      # 允许 web(3201) / admin(3202) 用预签名 PUT URL 直传，并公开 GET。
      # 生产 OSS 的 CORS 走 infra/docker/oss/apply-cors.sh（bucket 级）。
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3201,http://localhost:3202,https://www.tzjii.com,https://admin.tzjii.com"
      MINIO_API_CORS_ALLOW_METHODS: "GET,PUT,POST,HEAD"
      MINIO_API_CORS_ALLOW_HEADERS: "*"
      MINIO_API_CORS_MAX_AGE: "3000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tzj-dev

volumes:
  pg_data:
    driver: local
  minio_data:
    driver: local

networks:
  tzj-dev:
    driver: bridge
