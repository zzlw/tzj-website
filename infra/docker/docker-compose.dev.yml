# ============================================================
# TZJ Monorepo — Development Infrastructure (Docker Compose)
# ============================================================
# 原则: 应用跑在宿主机 (Native Node), 依赖跑在容器
# 启动: pnpm db:up   或  docker compose -f infra/docker/docker-compose.dev.yml up -d
# 停止: pnpm db:down 或  docker compose -f infra/docker/docker-compose.dev.yml down
# 日志: pnpm db:logs 或  docker compose -f infra/docker/docker-compose.dev.yml logs -f
# 清理: docker compose -f infra/docker/docker-compose.dev.yml down -v
# ============================================================

services:
  # ── PostgreSQL 15 ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tzj_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tzj_admin
      POSTGRES_PASSWORD: tzj_secret_dev
      POSTGRES_DB: tzj_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzj_admin -d tzj_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tzj-dev

  # ── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tzj_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tzj-dev

  # ── MinIO (S3-compatible Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: tzj_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API (应用程序连接)
      - "9001:9001"   # Web Console (浏览器访问)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tzj-dev

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  tzj-dev:
    driver: bridge
