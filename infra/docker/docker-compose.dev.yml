# ============================================================
# TZJ Monorepo — Development Infrastructure (Docker Compose)
# ============================================================
# 原则: 应用跑在宿主机 (Native Node), 依赖跑在容器
# 启动: pnpm db:up   或  docker compose -f infra/docker/docker-compose.dev.yml up -d
# 停止: pnpm db:down 或  docker compose -f infra/docker/docker-compose.dev.yml down
# 日志: pnpm db:logs 或  docker compose -f infra/docker/docker-compose.dev.yml logs -f
# 清理: docker compose -f infra/docker/docker-compose.dev.yml down -v
# ============================================================

services:
  # ── PostgreSQL 15 ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: tzj_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tzj_admin
      POSTGRES_PASSWORD: tzj_secret_dev
      POSTGRES_DB: tzj_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzj_admin -d tzj_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tzj-dev

  # ── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tzj_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tzj-dev

  # ── MinIO (S3-compatible Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: tzj_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API (应用程序连接)
      - "9001:9001"   # Web Console (浏览器访问)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # ── 开发环境 CORS（MinIO 原生全局配置，启动即生效，无需额外初始化容器）──
      # 允许 web(3001) / admin(3002) 用预签名 PUT URL 直传，并公开 GET。
      # 生产 OSS 的 CORS 走 infra/docker/oss/apply-cors.sh（bucket 级）。
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:3002,https://tzj.jiawen.live,https://tzj-admin.jiawen.live"
      MINIO_API_CORS_ALLOW_METHODS: "GET,PUT,POST,HEAD"
      MINIO_API_CORS_ALLOW_HEADERS: "*"
      MINIO_API_CORS_MAX_AGE: "3000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tzj-dev

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  tzj-dev:
    driver: bridge
