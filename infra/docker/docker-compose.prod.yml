name: tzj

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tzj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-tzj_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tzj} -d ${POSTGRES_DB:-tzj_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${IMAGE_REGISTRY}/tzj-api:${API_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env.prod
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    image: ${IMAGE_REGISTRY}/tzj-web:${WEB_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
      # 双轨 CSS：=1 时旧内核自动加载 legacy.css；留空/0 关闭（回滚开关，可运行时覆盖）
      LEGACY_CSS_ENABLED: ${LEGACY_CSS_ENABLED:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  admin:
    image: ${IMAGE_REGISTRY}/tzj-admin:${ADMIN_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
      # BFF 服务端直连 compose 内网 api，避免回落到构建期烘入的公网域名
      # 绕行 gateway 回环（链路长、依赖公网 DNS/TLS，抖动会放大为 5xx）
      ADMIN_API_URL: "http://api:4000/api/v1"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  # Turbo 远端缓存（构建加速）：GitHub Actions / Docker 构建共享，存储用 OSS 私有桶
  # （ducktors 的 S3 provider 硬编码 path-style，OSS 不兼容，故用本地卷；
  #   deploy.sh 每次部署清理 7 天前的旧产物，token 由 .env.prod.local 提供）
  turbo-cache:
    image: ghcr.io/ducktors/turborepo-remote-cache:2.12.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TURBO_TOKEN: ${TURBO_CACHE_TOKEN:?required}
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data/turborepocache
      STORAGE_PATH_USE_TMP_FOLDER: "false"
      LOG_LEVEL: warn
    volumes:
      - turbo-cache-data:/data
    expose:
      - "3000"

  gateway:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      BASE_DOMAIN: ${BASE_DOMAIN}
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint.d/90-periodic-reload.sh:/docker-entrypoint.d/90-periodic-reload.sh:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - admin

  acme:
    image: tzj-acme:prod
    build: ./acme
    restart: unless-stopped
    command: daemon
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      Ali_Key: ${ALI_KEY}
      Ali_Secret: ${ALI_SECRET}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
    volumes:
      - acme-data:/acme.sh
      - ./nginx/certs:/certs
      - ./acme:/scripts:ro

volumes:
  pgdata:
  acme-data:
  turbo-cache-data:
