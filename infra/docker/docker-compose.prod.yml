name: tzj

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tzj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-tzj_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tzj} -d ${POSTGRES_DB:-tzj_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z # 锁定版本，生产禁 latest
    restart: unless-stopped
    mem_limit: 512m # IAM/admin 操作会瞬时冲高，256m 会被 cgroup 杀导致 exit0 重启循环
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      # 浏览器预签名直传所需 CORS（与 dev 对齐，域名换生产值）
      MINIO_API_CORS_ALLOW_ORIGIN: "https://${WEB_DOMAIN},https://${ADMIN_DOMAIN}"
      MINIO_API_CORS_ALLOW_METHODS: "GET,PUT,POST,HEAD"
      MINIO_API_CORS_ALLOW_HEADERS: "*"
    volumes:
      - miniodata:/data
    expose:
      - "9000" # 仅 compose 内网，不映射宿主机端口；生产不开 9001 Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: ${IMAGE_REGISTRY}/tzj-api:${API_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env.prod
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    image: ${IMAGE_REGISTRY}/tzj-web:${WEB_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 320m
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  admin:
    image: ${IMAGE_REGISTRY}/tzj-admin:${ADMIN_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    mem_limit: 320m
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
      # BFF 服务端直连 compose 内网 api，避免回落到构建期烘入的公网域名
      # 绕行 gateway 回环（链路长、依赖公网 DNS/TLS，抖动会放大为 5xx）
      ADMIN_API_URL: "http://api:4000/api/v1"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  gateway:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      STATIC_DOMAIN: ${STATIC_DOMAIN}
      BASE_DOMAIN: ${BASE_DOMAIN}
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint.d/90-periodic-reload.sh:/docker-entrypoint.d/90-periodic-reload.sh:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - admin

  acme:
    image: tzj-acme:prod
    build: ./acme
    restart: unless-stopped
    command: daemon
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      STATIC_DOMAIN: ${STATIC_DOMAIN}
      Ali_Key: ${ALI_KEY}
      Ali_Secret: ${ALI_SECRET}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
    volumes:
      - acme-data:/acme.sh
      - ./nginx/certs:/certs
      - ./acme:/scripts:ro

volumes:
  pgdata:
  acme-data:
  miniodata:
