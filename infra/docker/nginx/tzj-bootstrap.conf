# 首次部署 / 证书申请前：仅 HTTP 反代（acme.sh DNS-01 完成后切换 tzj.conf）
server {
    listen 80;
    server_name tzj.jiawen.live tzj-admin.jiawen.live tzj-api.jiawen.live;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 证书就绪前临时直连（调试用，可选）
server {
    listen 8080;
    server_name tzj.jiawen.live;
    location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
}
server {
    listen 8080;
    server_name tzj-admin.jiawen.live;
    location / { proxy_pass http://127.0.0.1:3002; proxy_set_header Host $host; }
}
server {
    listen 8080;
    server_name tzj-api.jiawen.live;
    location / { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; }
}
