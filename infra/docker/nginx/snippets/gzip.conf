# 源站 gzip 压缩：用于不经 CDN 的域名（API / Admin），
# 压缩由 nginx 兜底（Next.js 自带 gzip 的响应不会被重复压缩）。
# 注意：
# - gzip_proxied any 必需——proxy_pass 的响应默认不参与压缩
# - gzip_types 刻意不含 text/event-stream，避免 SSE 被缓冲导致断流
# - gzip_min_length 过滤小响应，压缩开销大于收益
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;
