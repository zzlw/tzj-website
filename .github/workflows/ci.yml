# ============================================================
# TZJ Monorepo — CI/CD Pipeline (GitHub Actions)
# ============================================================
# 原则: 缓存优先, 安全门禁, 自动部署
# Turbo Remote Cache 让 CI 速度飞起
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
    # 文档提交不触发全量构建测试（Deploy 已有同类过滤）
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo Remote Cache (Vercel)
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── 1. Build & Test (Turbo) ────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 生成 Prisma Client（typecheck/build 依赖生成后的类型，generate 无需 DATABASE_URL）
      - name: Generate Prisma Client
        run: pnpm --filter @tzj/api exec prisma generate

      - name: Check legacy CSS tokens (dual-track)
        run: pnpm --filter @tzj/legacy-css theme:check

      - name: Lint (Biome)
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      # 权限注解门禁：裸端点（无 @RequirePermissions/@Roles/@Public/@AuthenticatedOnly/@AllowUnenrolled）
      # 会被 RolesGuard fail-closed 兜底 403，属漏标注 → 阻断 CI
      - name: Check API permission annotations
        run: node scripts/check-permissions.mjs

      # CI 校验构建注入本地占位值：web 的 lib/env.ts 在生产构建缺失 NEXT_PUBLIC_* 时 fail-fast
      # （生产真实值由 deploy.yml 的 Docker build-args 注入，此处仅为构建可通过）
      - name: Build & Test (Turbo)
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_S3_PUBLIC_DOMAIN: http://localhost:9000/tzj-uploads-dev

      - name: Verify legacy CSS artifacts (dual-track)
        run: |
          pnpm --filter @tzj/legacy-css verify
          git diff --exit-code -- packages/legacy-css/tailwind.config.cjs packages/legacy-css/legacy-theme.css apps/web/public/legacy apps/web/src/generated/legacy-css.ts

  # ── 1b. Lighthouse CI (Web) ────────────────────────────────
  lighthouse-web:
    name: Lighthouse CI (Web)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        # 走 turbo 以先构建 workspace 依赖（@tzj/device / @tzj/types / @tzj/ui 的 dist），
        # 与 Docker 构建链路保持一致；直接 --filter build 会因依赖未构建而 module not found
        run: pnpm exec turbo run build --filter=@tzj/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_S3_PUBLIC_DOMAIN: http://localhost:9000/tzj-uploads-dev

      - name: Run Lighthouse CI
        # pnpm dlx 代替 npm install -g（AGENTS.md 禁止 CI 中用 npm install）
        run: pnpm dlx @lhci/cli@0.14.0 autorun --config=apps/web/lighthouserc.json
        continue-on-error: true

  # ── 2. Docker Build & Security Scan ────────────────────────
  docker-build:
    name: Docker Build & Scan
    # main/develop 的镜像由 Deploy 工作流构建并扫描，这里只在 PR 校验构建，避免一次 push 重复构建 3 次
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        app: [web, admin, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (validate only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: tzj-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
            NEXT_PUBLIC_S3_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_S3_PUBLIC_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}

      # Trivy 安全扫描：结果直接输出到 CI 日志
      # （私有仓库无 GHAS，Code Scanning 不可用，不上传 SARIF）
      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tzj-${{ matrix.app }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH

  # ── 3. Dependency Audit ────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
