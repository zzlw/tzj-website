# ============================================================
# TZJ — 完整构建 + 部署（备用，主路径请用云效 Flow）
# ============================================================
# 跨境 GitHub Runner 构建 push ACR + SSH deploy
# 日常发布：Codeup push → 云效 pipeline
# Runner 离线 / 回滚：Actions → Deploy ECS (SSH)
# ============================================================

name: Deploy Production (Build + SSH)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  IMAGE_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}

jobs:
  build-push:
    name: Build & Push ACR (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tzj-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/tzj-${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
            NEXT_PUBLIC_S3_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_S3_PUBLIC_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.ECS_HOST }}
          username: ${{ vars.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "infra/docker/docker-compose.prod.yml,infra/docker/deploy.sh,infra/docker/.env.prod.local.example,infra/docker/nginx,infra/docker/acme,infra/docker/scripts"
          target: "/opt/tzj"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.ECS_HOST }}
          username: ${{ vars.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/tzj
            chmod +x deploy.sh
            if [[ ! -f .env.prod.local ]] && [[ -f .env.prod.local.example ]]; then
              cp .env.prod.local.example .env.prod.local
            fi
            ./deploy.sh all "${{ github.sha }}"
