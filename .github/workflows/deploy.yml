# ============================================================
# TZJ — 完整构建 + 部署（主路径）
# ============================================================
# GitHub Runner 构建 push ACR + SSH deploy
# 日常发布：push main 自动触发（保留手动）
# 回滚：Actions → Deploy ECS (SSH) 指定旧 sha
# ============================================================

name: Deploy Production (Build + SSH)

on:
  push:
    branches: ["main"]
    # docs-only 提交不触发生产部署（避免改文档就全量重建+滚动重启）
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
  IMAGE_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}

jobs:
  build-push:
    name: Build & Push ACR (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tzj-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/tzj-${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
            NEXT_PUBLIC_S3_PUBLIC_DOMAIN=${{ vars.NEXT_PUBLIC_S3_PUBLIC_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.ECS_HOST }}
          username: ${{ vars.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "infra/docker/docker-compose.prod.yml,infra/docker/docker-compose.acme.override.yml,infra/docker/deploy.sh,infra/docker/Makefile,infra/docker/.env.prod.local.example,infra/docker/nginx,infra/docker/acme"
          target: "/opt/tzj"
          strip_components: 2
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.ECS_HOST }}
          username: ${{ vars.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          # 2C2G 小机冷启动镜像拉取 + migrate + 滚动更新可能超过默认 10m；
          # 超时会杀掉 SSH 会话但服务器上的 deploy.sh 仍作为孤儿进程续跑，
          # 造成 CI 误报失败且状态不可观测。放宽到 20m 覆盖冷拉取最坏情况。
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/tzj
            chmod +x deploy.sh
            if [[ ! -f .env.prod.local ]] && [[ -f .env.prod.local.example ]]; then
              cp .env.prod.local.example .env.prod.local
            fi
            ./deploy.sh all "${{ github.sha }}"
