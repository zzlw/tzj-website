packages:
  - "apps/*"
  - "packages/*"
# 统一版本来源：web 与 admin 共用的依赖在此声明一次，
# 各应用用 "catalog:" 引用（保持各自为直接依赖，Next 仍可正常解析）。
catalog:
  # 共享运行时依赖（web 与 admin 均已使用）
  lucide-react: ^1.22.0
  next: ^16.2.9
  react: ^19.2.7
  react-dom: ^19.2.7
  socket.io-client: ^4.8.1
  tw-animate-css: ^1.4.0
  vditor: ^3.11.2
  # 共享开发依赖
  "@tailwindcss/postcss": ^4.3.1
  "@types/node": ^26.0.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  postcss: ^8.5.16
  tailwindcss: ^4.3.1
  typescript: ^6.0.3
  # 单应用使用、但属于跨应用共享基础库，集中版本以便未来复用
  zod: ^4.4.3
  recharts: ^3.9.1
  radix-ui: ^1.6.0
  "@tanstack/react-query": ^5.101.2
  react-hook-form: ^7.80.0
  "@hookform/resolvers": ^5.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  shadcn: ^4.12.0
  # 官网专属体验层，但 B 端未来也可能复用
  next-intl: ^4.13.1
  next-view-transitions: ^0.3.5
allowBuilds:
  '@alicloud/openapi-core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.22.0
  - postcss@8.5.16
  - png-to-ico@3.0.2
